name: Scrcpy
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: 0.2.1
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  ScrcpyCore:
    type: framework
    platform: iOS
    sources:
    - Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.oh-my-term.scrcpy.core
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true
        SWIFT_INCLUDE_PATHS:
        - $(SRCROOT)/Sources/AdbCrypto/include
        LIBRARY_SEARCH_PATHS:
        - $(SRCROOT)/build/boringssl/$(PLATFORM_NAME)/lib
        OTHER_LDFLAGS:
        - -lssl
        - -lcrypto
        - -lc++
    dependencies:
    - target: AdbCrypto
      link: true
  Scrcpy:
    type: application
    platform: iOS
    sources:
    - Sources/App
    - Assets.xcassets
    - path: Resources
      buildPhase: resources
    dependencies:
    - target: ScrcpyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.oh-my-term.scrcpy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Remote · scrcpy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to an Android device over ADB on your
          local network.
        NSMicrophoneUsageDescription: Forward your microphone to the connected Android
          device when you enable it.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSBonjourServices:
        - _adb-tls-pairing._tcp
        - _adb-tls-connect._tcp
  ScrcpyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - Tests/UITests
    dependencies:
    - target: Scrcpy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.oh-my-term.scrcpy.uitests
        GENERATE_INFOPLIST_FILE: true
  AdbCrypto:
    type: library.static
    platform: iOS
    sources:
    - Sources/AdbCrypto
    settings:
      base:
        HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Sources/AdbCrypto/include
        - $(SRCROOT)/build/boringssl/include
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: true
schemes:
  Scrcpy:
    build:
      targets:
        Scrcpy: all
    test:
      targets:
      - ScrcpyUITests
